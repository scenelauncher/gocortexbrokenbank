# GoCortex Broken Bank - Base Docker Compose Configuration
# This base configuration runs both services without exposing ports to the host
# Use this as a foundation for environment-specific overrides

services:
  gocortex-broken-bank:
    image: gocortexio/gocortexbrokenbank:latest
    container_name: gocortex-broken-bank
    restart: unless-stopped
    environment:
      - SESSION_SECRET=hardcoded-docker-secret-key
      - DATABASE_URL=sqlite:///app/instance/gocortexbrokenbank.db
      - FLASK_ENV=production
      - LOCALE=en
    volumes:
      - brokenbank-data:/app/instance
    # No ports exposed by default - add in override files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/", "&&", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  brokenbank-data:
    driver: local
